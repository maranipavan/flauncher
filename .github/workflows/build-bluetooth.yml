name: Build FLauncher with Bluetooth button

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply custom changes
        run: |
          echo '' | base64 -d > custom.patch
          git apply --verbose custom.patch

      - name: Add file receiver (Wi-Fi upload to TV)
        run: |
          echo '' | base64 -d | gunzip > receiver.patch
          git apply --verbose receiver.patch

      - name: Add text and link sending (phone to TV)
        run: |
          echo '' | base64 -d | gunzip > text.patch
          git apply --verbose text.patch

      - name: Add TV mouse cursor (accessibility service)
        run: |
          echo '' | base64 -d | gunzip > cursor.patch
          git apply --verbose cursor.patch
          python3 - <<'PYEOF'
          import re,sys
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p).read()
          if "CursorService" not in s:
              block='''
                  <service
                      android:name=".cursor.CursorService"
                      android:exported="true"
                      android:label="@string/cursor_service_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/cursor_service_config" />
                  </service>
          '''
              assert s.count("</application>")==1
              s=s.replace("</application>",block+"    </application>")
              open(p,"w").write(s)
          print("manifest updated")
          PYEOF

      - name: Add personal signing key
        run: |
          echo '' | base64 -d > android/app/flauncher-local.jks

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get packages and generate code
        run: |
          flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: flauncher-bluetooth-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
