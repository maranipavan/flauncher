name: Build FLauncher with Bluetooth button

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply custom changes
        run: |
          echo '' | base64 -d > custom.patch
          git apply --verbose custom.patch

      - name: Add personal signing key
        run: |
          echo '' | base64 -d > android/app/flauncher-local.jks

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get packages and generate code
        run: |
          flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: flauncher-bluetooth-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
